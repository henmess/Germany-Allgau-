name: Route check

# Runs the route-checker agent (.claude/agents/route-checker.md) whenever the itinerary changes,
# and posts its report as a comment on the "🧭 בדיקת מסלול" issue.
# Needs ONE of these repository secrets: CLAUDE_CODE_OAUTH_TOKEN (Claude subscription) or ANTHROPIC_API_KEY.
on:
  push:
    paths:
      - "index.html"
      - ".claude/agents/route-checker.md"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: route-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run route-checker agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Use the route-checker subagent to review this repository's trip itinerary.
            Have it write its full report (Hebrew, Markdown) to route-check-report.md in the repository root.
            Do not modify any other file.
          claude_args: >-
            --allowedTools "Task,Read,Grep,Glob,Write,WebSearch,WebFetch,Bash(curl:*)"

      - name: Post report to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s route-check-report.md ] || { echo "No report was written"; exit 1; }
          {
            echo "**בדיקה אחרי שינוי** · commit ${GITHUB_SHA::7}"
            echo
            cat route-check-report.md
          } > body.md
          title="🧭 בדיקת מסלול"
          num=$(gh issue list --state open --search "in:title בדיקת מסלול" --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" -F body.md; else gh issue create -t "$title" -F body.md; fi
